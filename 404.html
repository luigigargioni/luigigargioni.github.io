<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#03060a" />
  <title>404 | Luigi Gargioni</title>
  <link rel="icon" href="/favicon.svg" />
  <!-- absolute paths: GitHub Pages serves this page for any missing URL -->
  <link rel="stylesheet" href="/global.css" />
  <style>
    :root {
      --g: #3fc337;
      --c: #4cc9ff;
      --ink: #eef3f6;
      --mute: #93a0aa;
    }

    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, #0a1620 0%, #03060a 60%);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(3, 6, 10, 0.85));
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 24px;
      text-align: center;
      pointer-events: none;
    }

    .kicker {
      font: 400 12px/1.4 ui-monospace, 'Cascadia Code', Consolas, monospace;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--g);
    }

    h1 {
      margin: 6px 0 4px;
      font-size: clamp(120px, 26vw, 300px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: transparent;
      -webkit-text-stroke: 2px var(--g);
      text-shadow: 0 0 80px rgba(63, 195, 55, 0.35);
    }

    h2 {
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      padding: 13px 26px;
      border: 2px solid var(--g);
      border-radius: 999px;
      background: var(--g);
      color: #04130a;
      font-weight: 600;
      font-size: 15px;
      pointer-events: auto;
      transition: all 0.2s;
    }

    .button:focus-visible {
      outline: 2px solid var(--g);
      outline-offset: 4px;
    }

    .button:hover,
    .button:focus-visible {
      background: transparent;
      color: var(--g);
    }

    @media (max-width: 600px) {
      h1 {
        -webkit-text-stroke-width: 1.5px;
      }
    }
  </style>
</head>

<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="vignette"></div>

  <main>
    <span class="kicker" data-it="Errore 404" data-en="Error 404">Error 404</span>
    <h1 aria-hidden="true">404</h1>
    <h2 data-it="Questa pagina non esiste." data-en="This page does not exist.">This page does not exist.</h2>
    <a class="button" href="/" data-it="Torna alla home" data-en="Back to home">Back to home</a>
  </main>

  <script>
    // Same language the site uses (saved by i18next), otherwise the browser's.
    (function () {
      var saved = null
      try {
        saved = localStorage.getItem('i18nextLng')
      } catch (e) {}
      var lang = (saved || navigator.language || 'en').slice(0, 2) === 'it' ? 'it' : 'en'
      document.documentElement.lang = lang
      document.title = lang === 'it' ? '404 | Pagina non trovata' : '404 | Page not found'
      document.querySelectorAll('[data-' + lang + ']').forEach(function (el) {
        el.textContent = el.getAttribute('data-' + lang)
      })
    })();

    // Background: a slowly rotating sphere of particles behind the text,
    // like the one on the home page. No interaction.
    (function () {
      var canvas = document.getElementById('particles')
      var ctx = canvas.getContext('2d')
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      var ratio = Math.min(window.devicePixelRatio || 1, 2)
      var COUNT = 1600
      var TILT = 0.35
      var width = 0
      var height = 0

      // points on a unit sphere (Fibonacci lattice) with a colour each
      var points = []
      for (var i = 0; i < COUNT; i++) {
        var y = 1 - (i / (COUNT - 1)) * 2
        var r = Math.sqrt(1 - y * y)
        var a = i * 2.399963
        var hue = Math.random() * Math.random()
        points.push({
          x: Math.cos(a) * r,
          y: y,
          z: Math.sin(a) * r,
          color: [63 + Math.round(hue * 13), 195 + Math.round(hue * 6), 55 + Math.round(hue * 200)],
        })
      }

      function resize() {
        width = window.innerWidth
        height = window.innerHeight
        canvas.width = width * ratio
        canvas.height = height * ratio
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0)
        if (reduced) draw(0)
      }

      function draw(angle) {
        var radius = Math.min(width, height) * 0.42
        var cx = width / 2
        var cy = height / 2
        var cos = Math.cos(angle)
        var sin = Math.sin(angle)
        var cosT = Math.cos(TILT)
        var sinT = Math.sin(TILT)
        ctx.clearRect(0, 0, width, height)
        for (var i = 0; i < points.length; i++) {
          var p = points[i]
          // spin around the vertical axis, then tilt towards the viewer
          var x = p.x * cos - p.z * sin
          var z = p.x * sin + p.z * cos
          var y = p.y * cosT - z * sinT
          z = p.y * sinT + z * cosT
          var depth = (z + 1) / 2 // 0 back, 1 front
          var scale = 0.8 + depth * 0.35
          var c = p.color
          ctx.fillStyle =
            'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (0.12 + depth * 0.5).toFixed(3) + ')'
          ctx.beginPath()
          ctx.arc(cx + x * radius * scale, cy + y * radius * scale, 0.6 + depth * 1.3, 0, 6.283)
          ctx.fill()
        }
      }

      resize()
      window.addEventListener('resize', resize)
      if (reduced) return

      var start = performance.now()
      function frame(now) {
        draw(((now - start) / 1000) * 0.18)
        requestAnimationFrame(frame)
      }
      requestAnimationFrame(frame)
    })()
  </script>
</body>

</html>
